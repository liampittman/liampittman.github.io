---
layout: default
---

<article>
  <header>
    <h1>{{ page.title }}</h1>
    <p class="mono" style="color: var(--color-gray-dark);">{{ page.date | date: "%B %d, %Y" }}</p>
  </header>
  
  <div class="post-content">
    {{ content }}
  </div>

  {% if page.tags and page.tags.size > 0 %}
</br>
    <p class="post-tags">
        tags:
        {% for tag in page.tags %}
            <span class="tag">{{ tag }}</span>{% unless forloop.last %}, {% endunless %}
        {% endfor %}
    </p>
  {% endif %}
  
  <p style="margin-top: 2rem;"><a href="{{ '/blog' | relative_url }}">[<<< Back to blog]</a></p>
</article>
